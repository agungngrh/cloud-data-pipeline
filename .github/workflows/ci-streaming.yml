name: CI - Streaming

on:
  push:
    branches: [dev]
    paths: ["src/streaming/**", "src/core/**", "src/observability/**", "src/config/**", "tests/unit/**", "tests/beam/**"]
  pull_request:
    branches: [main]
    paths: ["src/streaming/**", "src/core/**", "src/observability/**", "src/config/**", "tests/unit/**", "tests/beam/**"]

jobs:
  streaming-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r src/streaming/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run Beam pipeline tests
        run: pytest tests/beam -v