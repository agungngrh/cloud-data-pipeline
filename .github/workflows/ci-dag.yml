name: CI - Airflow DAG

on:
  push:
    branches: [dev]
    paths: ["airflow/dags/**", "tests/dags/**"]
  pull_request:
    branches: [main]
    paths: ["airflow/dags/**", "tests/dags/**"]

jobs:
  dag-tests:
    runs-on: ubuntu-latest
    container:
      image: apache/airflow:2.10.5-python3.11
      options: --user 0
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          su airflow -c "pip install --no-cache-dir \
            -r requirements.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"

      - name: Run DAG tests
        run: pytest tests/dags -v