name: CI - dbt

on:
  push:
    branches: [dev]
    paths: ["dbt/**"]
  pull_request:
    branches: [main]
    paths: ["dbt/**"]

defaults:
  run:
    working-directory: ./dbt

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: jcdeah-009
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
      
      - name: Place credentials at expected path
        run: cp "${{ steps.auth.outputs.credentials_file_path }}" ../secrets/jcdeah-009-a939f492bee7.json

      - name: dbt debug
        run: dbt debug

      - name: dbt compile
        run: dbt compile

      - name: dbt test
        if: github.event_name == 'pull_request'
        run: dbt test