name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/unit tests/beam --cov=. --cov-report=term-missing

  airflow-dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build airflow image
        run: docker build -t airflow-ci:latest .
      - name: DAG validation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/tests:/opt/airflow/tests \
            airflow-ci:latest \
            pytest tests/dags/test_dag_integrity.py -v

  dbt-ci:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - run: pip install dbt-bigquery
      - name: dbt deps
        run: dbt deps
        working-directory: dbt
      - name: dbt compile
        run: dbt compile --target ci
        working-directory: dbt
      - name: dbt build
        run: dbt build --target ci
        working-directory: dbt