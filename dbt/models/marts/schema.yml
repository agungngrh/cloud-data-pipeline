version: 2

models:
  - name: daily_trips_summary
    description: "Daily trip summary aggregated by pickup date."
    columns:
      - name: pickup_date
        data_tests:
          - not_null
          - unique

  - name: hourly_demand_summary
    description: "Hourly trip demand patterns by pickup date and hour."
    columns:
      - name: pickup_date
        data_tests:
          - not_null

  - name: payment_behavior_summary
    description: "Trip metrics broken down by payment type and data source."
    columns:
      - name: payment_type
        data_tests:
          - not_null

      - name: data_source
        data_tests:
          - not_null

  - name: route_performance_summary
    description: "Route performance metrics grouped by pickup and dropoff locations."
    columns:
      - name: pickup_location_id
        data_tests:
          - not_null

  - name: zone_performance_summary
    description: "Location zone performance metrics grouped by location ID."
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique
  
  - name: unified_trips
    description: >
      Combined trip records from batch and streaming pipelines, enriched with
      pickup/dropoff zone information for cross-source analysis.
    columns:
      - name: _data_source
        description: Origin pipeline of the row (batch or streaming)
        tests:
          - accepted_values:
              values: ['batch', 'streaming']
      - name: pickup_datetime
        tests:
          - not_null