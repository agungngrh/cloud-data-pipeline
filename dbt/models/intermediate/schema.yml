version: 2

models:
  - name: int_batch_trips_flagged
    description: "Ephemeral model that computes data quality flags and metrics for raw batch trips."
    columns:
      - name: vendor_id
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: fare_amount
        data_tests:
          - not_null

      - name: trip_type
        data_tests:
          - accepted_values:
              values: [1, 2]
              quote: false 

  - name: int_batch_trips_quarantine
    description: "Isolates invalid batch trip records that failed data quality checks."
    columns:
      - name: quarantine_reason
        description: "Comma-separated list of failed validation rules."
        data_tests:
          - not_null

  - name: int_batch_trips_clean
    description: "Valid batch trip records that passed all data quality checks."
    columns:
      - name: trip_id
        description: "Surrogate key generated via FARM_FINGERPRINT."
        data_tests:
          - not_null
          - unique
      - name: vendor_id
        data_tests:
          - not_null

  - name: int_unified_trips_clean
    description: "Consolidated view of clean trip records from both batch and streaming pipelines."
    columns:
      - name: trip_id
        data_tests:
          - not_null

      - name: pu_location_id
        data_tests:
          - not_null
          
      - name: do_location_id
        data_tests:
          - not_null

      - name: _data_source
        description: "Indicates the ingestion pipeline source ('batch' or 'streaming')."
        data_tests:
          - not_null
          - accepted_values:
              values: ['batch', 'streaming']